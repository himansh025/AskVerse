spring.application.name=quora
server.port=${PORT:8080}

# --- Aiven MySQL connection ---
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# --- JWT and auth ---
spring.jwt.secret=${SPRING_JWT_SECRET}
app.auth.cookie-name=${APP_AUTH_COOKIE_NAME:JwtToken}
app.auth.cookie-secure=${APP_AUTH_COOKIE_SECURE:true}
app.auth.cookie-same-site=${APP_AUTH_COOKIE_SAME_SITE:None}

# --- CORS ---
app.cors.local-origins=${LOCAL:http://localhost:5173}
app.cors.production-origins=${PRODUCTION:https://askverse-client.vercel.app}
app.cors.payment-origins=${PAYMENT_ORIGINS:https://checkout.razorpay.com,https://api.razorpay.com,https://*.razorpay.com,null}

# --- Frontend ---
app.frontend.base-url=${APP_FRONTEND_BASE_URL:https://askverse-client.vercel.app}

# --- JPA / Hibernate ---
spring.jpa.show-sql=false
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

# --- Cloudinary ---
cloudinary.cloud_name=${CLOUDINARY_CLOUD_NAME}
cloudinary.api_key=${CLOUDINARY_API_KEY}
cloudinary.api_secret=${CLOUDINARY_API_SECRET}

# --- Payments ---
app.subscription.default-currency=${APP_SUBSCRIPTION_DEFAULT_CURRENCY:INR}
app.payment.default-gateway=${APP_PAYMENT_DEFAULT_GATEWAY:RAZORPAY}
razorpay.key-id=${RAZORPAY_KEY_ID}
razorpay.key-secret=${RAZORPAY_KEY_SECRET}

# --- AI Providers ---
ai.provider=${AI_PROVIDER:GROQ}
openai.api.key=${OPENAI_API_KEY}
openai.model=${OPENAI_MODEL:gpt-4-turbo}
gemini.api.key=${GEMINI_API_KEY}
gemini.model=${GEMINI_MODEL:gemini-2.5-pro}
groq.api.key=${GROQ_API_KEY}
groq.model=${GROQ_MODEL:llama-3.1-8b-instant}
